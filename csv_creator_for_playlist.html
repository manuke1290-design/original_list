<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Creator for Playlist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-24">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-600 text-white flex items-center justify-center shadow-md shadow-red-200">
                    <i class="fa-solid fa-file-csv text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">プレイリスト用CSV作成ツール</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">曲情報を入力して簡単にCSVを出力・編集できます</p>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex items-center gap-2">
                <label class="cursor-pointer text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-upload text-slate-500"></i>
                    <span>CSV取込</span>
                    <input type="file" id="csvFileInput" accept=".csv,.tsv,.txt" class="hidden" onchange="importCSV(event)">
                </label>
                <button onclick="clearAllRows()" class="text-xs sm:text-sm px-3 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="hidden sm:inline">全クリア</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full flex-grow">

        <!-- Controls Bar -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-sm text-slate-600">
                現在の登録数: <strong id="rowCount" class="text-red-600 font-bold text-base">0</strong> 件
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="addRow()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-medium text-sm rounded-lg transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>1行追加</span>
                </button>
                <button onclick="addMultipleRows(5)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition flex items-center justify-center gap-1">
                    <span>+5行追加</span>
                </button>
            </div>
        </div>

        <!-- CSV Data Table Container -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[950px]">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                            <th class="py-3 px-3 text-center w-12">#</th>
                            <th class="py-3 px-3 w-48">曲名 <span class="text-red-500">*</span></th>
                            <th class="py-3 px-3 w-40">アーティスト名</th>
                            <th class="py-3 px-3 w-56">YouTube URL</th>
                            <th class="py-3 px-3 w-40">タグ <span class="text-xs text-slate-400 font-normal">(スペース/カンマ区切り)</span></th>
                            <th class="py-3 px-3 w-32">ジャンル</th>
                            <th class="py-3 px-3 min-w-[280px]">その他一言 <span class="text-xs text-slate-400 font-normal">(広め)</span></th>
                            <th class="py-3 px-3 text-center w-20">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Bottom Action Bar (Fixed) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-xs text-slate-500">
                <i class="fa-solid fa-circle-info text-blue-500 mr-1"></i>
                項目順: 曲名, アーティスト名, URL, タグ, ジャンル, その他一言
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button onclick="copyCSVToClipboard()" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i>
                    <span>CSVテキストをコピー</span>
                </button>
                <button onclick="downloadCSV()" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm transition shadow-md shadow-red-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span>CSVファイルをダウンロード</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 right-4 z-50 transform translate-y-[-20px] opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">メッセージ</span>
    </div>

    <script>
        // Sample default 10 entries for quick start
        const initialSampleData = [
            { title: 'Pretender', artist: 'Official髭男dism', url: 'https://www.youtube.com/watch?v=TQ8WlA2GXbk', tags: '切ない 名曲', genre: 'J-POP', comment: 'メロディラインと歌詞の切なさが胸に刺さります。' },
            { title: 'アイドル', artist: 'YOASOBI', url: 'https://youtu.be/ZRtdQ81jPUQ', tags: 'アニソン エネルギッシュ', genre: 'J-POP', comment: '転調とボーカルの表現力が圧巻。テンションを上げたい時におすすめ。' },
            { title: 'ドライフラワー', artist: '優里', url: 'https://www.youtube.com/watch?v=kzZ6KXDM1RI', tags: 'アコースティック バラード', genre: 'J-POP', comment: 'アコースティックギターの音色と言葉選びの繊細さが魅力的。' },
            { title: 'ミックスナッツ', artist: 'Official髭男dism', url: 'https://www.youtube.com/watch?v=CbH2F0kXgTY', tags: '疾走感 スパイファミリー', genre: 'J-ROCK', comment: 'ベースラインがとにかく格好いい！ドライブ中に聴きたい最高のナンバー。' },
            { title: '', artist: '', url: '', tags: '', genre: '', comment: '' },
            { title: '', artist: '', url: '', tags: '', genre: '', comment: '' },
            { title: '', artist: '', url: '', tags: '', genre: '', comment: '' },
            { title: '', artist: '', url: '', tags: '', genre: '', comment: '' },
            { title: '', artist: '', url: '', tags: '', genre: '', comment: '' },
            { title: '', artist: '', url: '', tags: '', genre: '', comment: '' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            initTable(initialSampleData);
        });

        function initTable(dataArray) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            dataArray.forEach(data => {
                addRowUI(data);
            });
            updateRowCount();
        }

        function addRow(data = {}) {
            addRowUI(data);
            updateRowCount();
        }

        function addMultipleRows(count) {
            for (let i = 0; i < count; i++) {
                addRowUI({});
            }
            updateRowCount();
        }

        function addRowUI(data = {}) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50/80 transition';

            const title = data.title || '';
            const artist = data.artist || '';
            const url = data.url || '';
            const tags = data.tags || '';
            const genre = data.genre || '';
            const comment = data.comment || '';

            tr.innerHTML = `
                <td class="py-2 px-3 text-center text-slate-400 font-mono text-xs row-number"></td>
                <td class="py-2 px-3">
                    <input type="text" value="${escapeAttr(title)}" placeholder="例: Pretender" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white bg-slate-50/50">
                </td>
                <td class="py-2 px-3">
                    <input type="text" value="${escapeAttr(artist)}" placeholder="例: Official髭男dism" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white bg-slate-50/50">
                </td>
                <td class="py-2 px-3">
                    <input type="url" value="${escapeAttr(url)}" placeholder="https://www.youtube.com/..." class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white bg-slate-50/50">
                </td>
                <td class="py-2 px-3">
                    <input type="text" value="${escapeAttr(tags)}" placeholder="#エモい #夜" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white bg-slate-50/50">
                </td>
                <td class="py-2 px-3">
                    <input type="text" value="${escapeAttr(genre)}" placeholder="例: J-POP" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white bg-slate-50/50">
                </td>
                <td class="py-2 px-3">
                    <textarea placeholder="自由に一言コメントを入力..." rows="2" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white bg-slate-50/50 resize-y min-h-[52px] leading-relaxed">${escapeHtml(comment)}</textarea>
                </td>
                <td class="py-2 px-3 text-center">
                    <button onclick="removeRow(this)" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
            updateRowIndices();
        }

        function removeRow(btn) {
            const tr = btn.closest('tr');
            tr.remove();
            updateRowCount();
            updateRowIndices();
        }

        function clearAllRows() {
            if (confirm("全ての入力行を削除してもよろしいですか？")) {
                document.getElementById('tableBody').innerHTML = '';
                updateRowCount();
                showToast("全行クリアしました", "info");
            }
        }

        function updateRowIndices() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, idx) => {
                const numCell = row.querySelector('.row-number');
                if (numCell) numCell.innerText = idx + 1;
            });
        }

        function updateRowCount() {
            const rows = document.querySelectorAll('#tableBody tr');
            document.getElementById('rowCount').innerText = rows.length;
        }

        function collectData() {
            const rows = document.querySelectorAll('#tableBody tr');
            const dataList = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                const textarea = row.querySelector('textarea');

                const title = inputs[0] ? inputs[0].value.trim() : '';
                const artist = inputs[1] ? inputs[1].value.trim() : '';
                const url = inputs[2] ? inputs[2].value.trim() : '';
                const tags = inputs[3] ? inputs[3].value.trim() : '';
                const genre = inputs[4] ? inputs[4].value.trim() : '';
                const comment = textarea ? textarea.value.trim() : '';

                if (title || artist || url || tags || genre || comment) {
                    dataList.push({ title, artist, url, tags, genre, comment });
                }
            });

            return dataList;
        }

        function generateCSVString() {
            const dataList = collectData();
            if (dataList.length === 0) return '';

            let csvContent = '曲名,アーティスト名,URL,タグ,ジャンル,その他一言\n';

            dataList.forEach(item => {
                const row = [
                    escapeCSVField(item.title),
                    escapeCSVField(item.artist),
                    escapeCSVField(item.url),
                    escapeCSVField(item.tags),
                    escapeCSVField(item.genre),
                    escapeCSVField(item.comment)
                ];
                csvContent += row.join(',') + '\n';
            });

            return csvContent;
        }

        function escapeCSVField(str) {
            if (!str) return '';
            let val = str.replace(/"/g, '""');
            if (val.includes(',') || val.includes('\n') || val.includes('\r') || val.includes('"')) {
                val = `"${val}"`;
            }
            return val;
        }

        function downloadCSV() {
            const csvString = generateCSVString();
            if (!csvString) {
                showToast("出力するデータがありません。曲名等を入力してください。", "error");
                return;
            }

            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]); // UTF-8 BOM
            const blob = new Blob([bom, csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `playlist_import_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("CSVファイルをダウンロードしました！", "success");
        }

        function copyCSVToClipboard() {
            const csvString = generateCSVString();
            if (!csvString) {
                showToast("出力するデータがありません", "error");
                return;
            }

            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = csvString;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand("copy");
            document.body.removeChild(tempTextArea);

            showToast("CSVテキストをクリップボードにコピーしました！", "success");
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseAndLoadCSV(text);
                showToast(`ファイル「${file.name}」を取り込みました`, "success");
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function parseAndLoadCSV(text) {
            if (!text || !text.trim()) return;

            const lines = text.split(/\r\n|\n|\r/);
            if (lines.length === 0) return;

            const firstLine = lines[0];
            const delimiter = firstLine.includes('\t') ? '\t' : ',';
            const firstCols = parseCSVLine(firstLine, delimiter).map(c => c.trim().toLowerCase());

            let hasHeader = false;
            let titleIdx = 0, artistIdx = 1, urlIdx = 2, tagIdx = 3, genreIdx = 4, commentIdx = 5;

            firstCols.forEach((col, idx) => {
                if (col.includes('曲名') || col.includes('タイトル')) { titleIdx = idx; hasHeader = true; }
                else if (col.includes('アーティスト')) { artistIdx = idx; hasHeader = true; }
                else if (col.includes('url')) { urlIdx = idx; hasHeader = true; }
                else if (col.includes('タグ')) { tagIdx = idx; hasHeader = true; }
                else if (col.includes('ジャンル')) { genreIdx = idx; hasHeader = true; }
                else if (col.includes('一言') || col.includes('想い') || col.includes('メモ') || col.includes('その他')) { commentIdx = idx; hasHeader = true; }
            });

            const startRow = hasHeader ? 1 : 0;
            const importedData = [];

            for (let i = startRow; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = parseCSVLine(line, delimiter);
                importedData.push({
                    title: cols[titleIdx] || '',
                    artist: cols[artistIdx] || '',
                    url: cols[urlIdx] || '',
                    tags: cols[tagIdx] || '',
                    genre: cols[genreIdx] || '',
                    comment: cols[commentIdx] || ''
                });
            }

            if (importedData.length > 0) {
                initTable(importedData);
            }
        }

        function parseCSVLine(text, delimiter) {
            let fields = [];
            let currentField = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === delimiter && !inQuotes) {
                    fields.push(currentField);
                    currentField = '';
                } else {
                    currentField += c;
                }
            }
            fields.push(currentField);
            return fields;
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            toastIcon.className = type === "success" 
                ? "fa-solid fa-circle-check text-emerald-400" 
                : "fa-solid fa-circle-exclamation text-amber-400";

            toast.classList.remove('translate-y-[-20px]', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-20px]', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Helper: Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Helper: Escape Attribute
        function escapeAttr(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
